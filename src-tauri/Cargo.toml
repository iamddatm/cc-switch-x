[package]
name = "cc-switch-x"
version = "0.13.0"
edition = "2021"

[lib]
name = "cc_switch_x_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
# preserve_order：改 agent 的 JSON 配置时必须保住原有键序，否则「非管辖键不变」无从谈起
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
toml_edit = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
thiserror = "2"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
# Codex 会把旧会话压成 .jsonl.zst；流式解压，不整文件读入内存
zstd = "0.13"
# 会话 Markdown 导出用系统保存对话框选路径
tauri-plugin-dialog = "2"
# 应用内更新：检查、下载、安装都走后端，前端不直接暴露插件命令
tauri-plugin-updater = "2.14"
# 开机自启：Windows 走注册表，macOS 走登录项，Linux 走 XDG autostart
auto-launch = "0.5"
# Skill 来源安装/更新：GitHub 归档走阻塞客户端，放进 spawn_blocking，避免占用 UI 线程
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "socks"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

# 读取登录项当前指向的命令行，升级时只给指向本程序的旧条目补启动参数
[target.'cfg(windows)'.dependencies]
winreg = "0.10"
